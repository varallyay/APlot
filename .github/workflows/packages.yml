# The installable packages of APlot, built on GitHub's own machines.
#
# Runs when a version tag is pushed (git tag -a v1.3.6 -m "APlot 1.3.6";
# git push origin v1.3.6) and by hand (Actions > Packages > Run workflow).
# A tag also puts every package on the Releases page of the repository.
#
#   light         .deb  .rpm  light .dmg  light .msi        (Ubuntu)
#   frozen        APlot with its own Python, by PyInstaller:
#                   macOS arm64 and x86_64 -> self-contained .dmg
#                   Windows                -> folder for the .msi
#                   Linux                  -> folder for the .flatpak
#   selfcontained the self-contained .msi and .flatpak of those folders (Ubuntu)
#   release       everything on the Releases page (tags only)
#
# See packaging/build_packages.py and packaging/build_frozen.py.
name: Packages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  light:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-numpy python3-pandas python3-matplotlib \
            python3-pil python3-pil.imagetk rpm xorriso wixl \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - name: Build
        run: python3 packaging/build_packages.py deb rpm dmg msi
      - uses: actions/upload-artifact@v4
        with:
          name: light
          path: packaging/dist/*

  frozen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon
            name: macos-arm64
          - os: macos-13          # Intel
            name: macos-x86_64
          - os: windows-latest
            name: windows
          - os: ubuntu-24.04
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tk (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libtk8.6 tk
      - name: Packages
        run: >
          python -m pip install --upgrade pip &&
          python -m pip install pyinstaller numpy pandas matplotlib pillow
          openpyxl tkinterdnd2
      - name: pyobjc (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install pyobjc-framework-Cocoa
      - name: Check
        run: python -c "import tkinter, numpy, pandas, matplotlib; print(tkinter.TkVersion, numpy.__version__, pandas.__version__, matplotlib.__version__)"
      - name: Build
        run: python packaging/build_frozen.py
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-${{ matrix.name }}
          path: packaging/dist/*

  selfcontained:
    needs: frozen
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-tk python3-numpy python3-pandas python3-matplotlib \
            python3-pil python3-pil.imagetk wixl flatpak \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: actions/download-artifact@v4
        with:
          name: frozen-windows
          path: frozen
      - uses: actions/download-artifact@v4
        with:
          name: frozen-linux
          path: frozen
      - name: Build
        run: |
          python3 packaging/build_packages.py msi --windows frozen/APlot-*-Windows-frozen.zip
          python3 packaging/build_packages.py flatpak --linux frozen/APlot-*-Linux-frozen.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: selfcontained
          path: |
            packaging/dist/*.msi
            packaging/dist/*.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [light, frozen, selfcontained]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true
      - name: The packages
        run: ls -la all
      - uses: softprops/action-gh-release@v2
        with:
          name: APlot ${{ github.ref_name }}
          files: |
            all/*.deb
            all/*.rpm
            all/*.dmg
            all/*.msi
            all/*.flatpak
            all/*.app.zip
